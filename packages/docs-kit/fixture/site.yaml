# yaml-language-server: $schema=../../../schema/site.schema.json
name: fixture
tagline: Test site that exercises every part of the docs-kit layout.
headline: Every part of the layout, on one page.
eyebrow: docs-kit fixture
description: The landing page is rendered from `site.yaml` only; this fixture sets every optional field.
theme: default
logo: { light: ./src/assets/logo.svg, dark: ./src/assets/logo-dark.svg }
art: ./src/assets/hero.svg
repo: https://github.com/Zebradil/docs-kit
install:
  - { label: Nix, code: "nix run github:Zebradil/fixture" }
  - { label: Cargo, code: "cargo install fixture" }
  - { label: Go, code: "go install github.com/Zebradil/fixture@latest" }
features:
  - title: Rendered from site.yaml
    body: The landing page has no hand-written prose; edit `site.yaml` instead.
  - title: Swappable themes
    body: A theme is a CSS file of design tokens and changes look only.
  - title: Diátaxis sidebar
    body: Getting started, guides, concepts and reference, in that order.
flow:
  highlight: docs-kit
  steps:
    - { from: site.yaml, to: docs-kit, label: content contract }
    - { from: docs-kit, to: Starlight, label: config + theme, arrow: both }
    - { from: Pages, to: docs-kit, label: deploy, arrow: back }
  note: Arrows point the way data moves.
  art: ./src/assets/flow.svg
cascade:
  request: GET /page
  hub: { name: docs-kit, body: Picks the first tier that answers. }
  tiers:
    - name: local
      label: tier 1
      backends:
        - { id: a, name: "http://a.lan" }
        - { id: b, name: "https://b.example" }
    - name: public
      label: tier 2
      backends:
        - { id: c, name: "https://c.example" }
  scenarios:
    - label: Local hit
      states: { a: { state: hit }, b: { state: idle, text: tier already hit } }
    - label: Fallback
      note: Tier 1 has no `page`, so the request falls through.
      states: { a: { state: down, text: probe failed }, b: { state: miss }, c: { state: hit } }
diff:
  intro: A change on the left, what it does to each target on the right.
  change:
    files:
      - path: site.yaml
        diff: |
          @@ -1,2 +1,2 @@
           name: fixture
          -theme: default
          +theme: mono
  tabs:
    - label: docs
      files:
        - path: dist/_astro/theme.css
          diff: |
            @@ -1,3 +1,3 @@
             :root {
            -  --sl-color-accent: teal;
            +  --sl-color-accent: gray;
             }
    - label: reference
      files: []
tree:
  intro: Each leaf inherits every level above it.
  root:
    name: docs/
    file: site.yaml
    note: the content contract
    children:
      - name: guides/
        children:
          - { name: setup/, note: "`id: guides-setup`", id: setup }
      - { name: reference/, file: cli.md, id: reference }
components:
  intro: What the kit ships.
  items:
    - { name: "@zebradil/docs-kit", body: Astro config and landing page. }
    - { name: help2md, body: CLI reference from `--help`. }
    - { name: docs.yml, body: Reusable build and deploy workflow. }
links:
  - { label: Content contract, href: "https://github.com/Zebradil/docs-kit/blob/main/schema/site.schema.json" }
reference:
  # The replay binary needs no build; this command only proves build runs from the repository root.
  cli: { bin: clapdemo, build: "test -x refgen/testdata/bin/clapdemo", path: refgen/testdata/bin/clapdemo }
