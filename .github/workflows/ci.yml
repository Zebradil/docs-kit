name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test

  fixture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/docs-kit/fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      # Resolves the kit's current dependencies like a fresh consumer; the fixture lock (used by
      # pages.yml) keeps whatever the kit declared when it was generated, since npm never refreshes a
      # file: dependency's metadata.
      - run: npm install --no-package-lock
      - name: Build with each theme
        run: |
          for theme in default mono porridge sieve vortex; do
            sed -i "s/^theme: .*/theme: $theme/" site.yaml
            npx astro build --outDir "dist-$theme"
          done
      # A theme changes look only: pages must be identical except for the hashed stylesheet name.
      - name: Themes change only CSS
        run: |
          cd dist-default
          find . -name '*.html' | while read -r page; do
            for other in mono porridge sieve vortex; do
              diff <(sed -E 's|/_astro/[^"]+\.css||g' "$page") \
                   <(sed -E 's|/_astro/[^"]+\.css||g' "../dist-$other/$page")
            done
          done
      - name: Pages are served as Markdown for agents
        run: |
          cd dist-default
          grep -F '](https://zebradil.github.io/docs-kit/guides/configure.md)' llms.txt
          for file in guides/configure.md llms-full.txt; do grep -Fx '# Configure the fixture' "$file"; done
      # The kit's own release tags carry the fixture from v0.10 on, so at least one release must build with this kit.
      - name: Released versions build with the current kit
        run: |
          git fetch --depth=1 --no-tags origin '+refs/tags/v*:refs/tags/v*'
          npx --no-install docs-kit-versions --default-branch main
          jq -e 'length > 1 and .[0] == {name: "main", path: ""}' dist/versions.json
          for path in $(jq -r '.[1:][].path' dist/versions.json); do
            grep -F '<meta name="robots" content="noindex"' "dist/${path}guides/configure/index.html"
            grep -F "https://zebradil.github.io/docs-kit/${path}guides/configure.md" "dist/${path}llms.txt"
          done

  plugin:
    runs-on: ubuntu-latest
    env:
      CLAUDE: npx --yes @anthropic-ai/claude-code@2.1.283
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: $CLAUDE plugin validate --strict .
      # Installs from GitHub, as a user would, so the plugin is copied into the cache rather than
      # loaded in place from the checkout.
      - name: Install and list skills
        env:
          SOURCE: ${{ github.event.pull_request.head.repo.full_name || github.repository }}#${{ github.head_ref || github.ref_name }}
        run: |
          $CLAUDE plugin marketplace add "$SOURCE"
          $CLAUDE plugin install docs-kit@docs-kit
          $CLAUDE plugin details docs-kit | grep -F 'Skills (3)  docs-audit, docs-bootstrap, docs-write'
          # The skills reach kit files through ${CLAUDE_SKILL_DIR}/../.., the plugin root.
          ls ~/.claude/plugins/cache/docs-kit/docs-kit/*/{CONTEXT.md,schema/site.schema.json,refgen/help2md.mjs}
