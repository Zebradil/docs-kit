name: docs

on:
  workflow_call:
    inputs:
      directory:
        description: Docs directory holding site.yaml and package.json, relative to the repository root.
        type: string
        default: docs
      nix:
        description: Install Nix before the reference.cli build command runs, for builds like `nix build`.
        type: boolean
        default: false
      deploy:
        description: Deploy to GitHub Pages on pushes to the default branch. Needs Pages enabled with source "GitHub Actions".
        type: boolean
        default: true
      prebuild:
        description: Shell command run from the repository root before the CLI build, for files the site needs that are generated rather than committed, such as a demo under the docs directory's public/.
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    env:
      REFERENCE: src/content/docs/reference/cli
      DEPLOY: ${{ inputs.deploy && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ inputs.directory }}/package-lock.json
      - run: npm ci

      - name: Read reference.cli and versions from site.yaml
        id: site
        run: >-
          node -e 'const site = require("yaml").parse(require("fs").readFileSync("site.yaml", "utf8"));
          console.log("cli=" + JSON.stringify(site?.reference?.cli ?? {}));
          console.log("versions=" + JSON.stringify(site?.versions ?? null))' >> "$GITHUB_OUTPUT"

      - name: Install Nix
        if: inputs.nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - name: Prebuild
        if: inputs.prebuild
        working-directory: .
        env:
          PREBUILD: ${{ inputs.prebuild }}
        run: eval "$PREBUILD"

      - name: Build CLI
        if: fromJSON(steps.site.outputs.cli).build
        working-directory: .
        env:
          BUILD: ${{ fromJSON(steps.site.outputs.cli).build }}
        run: eval "$BUILD"

      - name: Generate CLI reference
        if: fromJSON(steps.site.outputs.cli).bin
        env:
          BIN: ${{ fromJSON(steps.site.outputs.cli).bin }}
          BIN_PATH: ${{ fromJSON(steps.site.outputs.cli).path }}
        # --no-install: never fall back to the unrelated `help2md` package on the npm registry.
        run: |
          [ -z "$BIN_PATH" ] || BIN=$GITHUB_WORKSPACE/$BIN_PATH
          npx --no-install help2md --bin "$BIN" --out "$REFERENCE"

      - name: Check generated reference is committed
        if: github.event_name == 'pull_request' && fromJSON(steps.site.outputs.cli).bin
        run: |
          if [ -z "$(git status --porcelain -- "$REFERENCE")" ]; then exit 0; fi
          echo "::error::Generated CLI reference in $INPUTS_DIRECTORY/$REFERENCE is stale. Run refgen locally and commit the result."
          echo "Lines marked - are committed, + are what refgen generates now."
          git --no-pager diff --stat -- "$REFERENCE"
          git --no-pager diff -- "$REFERENCE"
          git ls-files --others --exclude-standard -- "$REFERENCE" | sed 's/^/new file: /'
          echo
          echo "Regenerate from $INPUTS_DIRECTORY/ with the freshly built $BIN: npx --no-install help2md --bin <path to $BIN> --out $REFERENCE"
          exit 1
        env:
          INPUTS_DIRECTORY: ${{ inputs.directory }}
          BIN: ${{ fromJSON(steps.site.outputs.cli).bin }}

      - name: Build site
        run: npx --no-install astro build

      # Only when deploying: a release that no longer builds is skipped with a warning, so a pull request would pass anyway.
      - name: Build released versions
        if: env.DEPLOY == 'true' && fromJSON(steps.site.outputs.versions)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # A fetch whose refspec matches no tag exits 1 without a message, so a repository before its first release skips it.
        run: |
          if [ -n "$(git ls-remote --tags origin 'refs/tags/v*')" ]; then
            git fetch --depth=1 --no-tags origin '+refs/tags/v*:refs/tags/v*'
          fi
          npx --no-install docs-kit-versions --default-branch "$DEFAULT_BRANCH"

      - name: Upload site
        if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.directory }}/dist

  deploy:
    needs: build
    if: inputs.deploy && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    concurrency: pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
